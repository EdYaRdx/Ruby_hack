openapi: 3.0.3
info:
  title: Finch Checkout API
  version: 2.0.0
components:
  securitySchemes:
    AccessToken:
      type: apiKey
      in: query
      name: access_token
paths:
  /transfers:
    post:
      operationId: submitTransfer
      security: [{ AccessToken: [] }]
      parameters:
        - { name: region, in: query, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, beneficiary]
              properties:
                amount:
                  type: number
                  description: Transfer amount in dollars, major units.
                beneficiary: { type: string }
                currency: { type: string, enum: [USD] }
      responses:
        '202':
          description: Accepted for processing
  /transfers/{transfer_id}:
    get:
      operationId: lookupTransferState
      security: [{ AccessToken: [] }]
      parameters:
        - { name: transfer_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Transfer state
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [queued, settled] }
