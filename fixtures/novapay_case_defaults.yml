provider: NovaPay
money:
  provider_subunit: kopecks
  scale: 100
statuses:
  pending: in_progress
  processing: in_progress
  completed: approved
  failed: rejected
  cancelled: rejected
webhook:
  raw_body: true
  signature_encoding: hex
  source: CASE_DEFAULT
examples:
  create_request:
    operation:
      amount: 15000.0
      currency: RUB
      id: op_abc123
      idempotency_key: key-1
      request_method: sbp
      payout_requisite:
        sbp:
          phone: "79001234567"
          bank_code: "044525225"
          bank_name: "Сбербанк"
    expected_provider_amount: 1500000
    expected_http_status: 201
    expected_host_result:
      result:
        id: np_abc123
  card_request:
    operation:
      amount: 15000.0
      currency: RUB
      id: op_card123
      request_method: card
      payout_requisite:
        card_number: "4111111111111111"
        phone: "79001234567"
    expected_provider_amount: 1500000
    expected_http_status: 201
    expected_host_result:
      result:
        id: np_card123
  fetch_status:
    operation:
      id: np_7f3a9b2c
    response:
      id: np_7f3a9b2c
      status: completed
      amount: 1500000
      currency: RUB
    expected_host_status: approved
    expected_host_amount: 15000.0
    expected_http_status: 200
  validation_error:
    operation:
      amount: 999.99
      currency: RUB
      id: op_too_small
      payout_requisite:
        sbp:
          phone: "79001234567"
          bank_code: "044525225"
    expected_http_status: 422
    expected_error_code: validation_error
  callback_completed:
    body:
      event: payout.completed
      payout_id: np_7f3a9b2c
      external_id: op_abc123
      status: completed
    expected_host_status: approved
  callback_processing:
    body:
      event: payout.processing
      payout_id: np_7f3a9b2c
      external_id: op_abc123
      status: processing
    expected_host_status: in_progress
  callback_failed:
    body:
      event: payout.failed
      payout_id: np_7f3a9b2c
      external_id: op_abc123
      status: failed
    expected_host_status: rejected
  callback_cancelled:
    body:
      event: payout.cancelled
      payout_id: np_7f3a9b2c
      external_id: op_abc123
      status: cancelled
    expected_host_status: rejected
  response:
    provider_amount: 1500000
    expected_host_amount: 15000.0
    status: completed
  webhook:
    status: completed
    signature_algorithm: HMAC-SHA256
    encoding: hex
