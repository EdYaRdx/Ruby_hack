profile_version: 1
name: heliospay_payments_v1
class_name: Provider::BaseService
service_name_pattern: Provider::<Name>Service
required_methods:
  - check_conditions
  - create_request
  - process_callback
  - fetch_status
request_method_semantics: gateway_payment_method
canonical_operations:
  - create
  - status
  - callback
canonical_amount:
  field: operation.amount
  currency: EUR
  unit: major
callback_actions:
  approved: approve_operation
  rejected: reject_operation
  in_progress: null
helpers:
  - success
  - failure
  - approve_operation
  - reject_operation
check_conditions:
  call_super: true
failure_contract:
  arguments: [code, i18n_key]
  validation_status: 422
  validation_code: unprocessable_entity
  validation_i18n_key: provider.validation_error
  allowed_codes: [bad_request, unauthorized, forbidden, unprocessable_entity, too_many_requests, internal_server_error, not_found]
  http_mappings:
    '400': { code: bad_request, i18n_key: provider.validation_error }
    '401': { code: unauthorized, i18n_key: provider.invalid_credentials }
    '404': { code: not_found, i18n_key: provider.not_found }
    '409': { code: unprocessable_entity, i18n_key: provider.conflict }
    '422': { code: unprocessable_entity, i18n_key: provider.validation_error }
    '429': { code: too_many_requests, i18n_key: provider.rate_limit }
    '500': { code: internal_server_error, i18n_key: provider.internal_error }
    '502': { code: internal_server_error, i18n_key: provider.transport_error }
